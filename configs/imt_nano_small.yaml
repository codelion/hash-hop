# IMT-Nano Small: Quick iteration config for testing
# Smaller context for faster iteration during development

model:
  # Encoder
  d_model: 256
  encoder_layers: 2
  encoder_heads: 4
  encoder_ff_dim: 1024
  chunk_size: 512

  # Index
  index_dim: 128
  num_index_heads: 4
  keys_per_chunk: 10
  num_clusters: 256
  temperature: 1.0

  # Decoder
  decoder_layers: 3
  decoder_heads: 4
  decoder_ff_dim: 1024
  retrieval_top_k: 4

  # Other
  dropout: 0.1
  max_hash_length: 20
  use_gradient_checkpointing: true
  chunk_batch_size: 16
  memory_limit_fraction: 0.33  # Limit to ~12GB on 36GB system

training:
  learning_rate: 0.001  # Increased for faster learning
  weight_decay: 0.01
  warmup_steps: 100
  max_steps: 10000
  gradient_accumulation: 1
  eval_every: 100
  eval_samples: 5
  save_every: 500
  log_every: 10

  # Data generation - 100K tokens (faster iteration)
  n_chars_problem: 100000
  num_queries: 5
  hops: 2
  hash_pair_str_length: 16

  # Loss weights
  lambda_retrieval: 1.0  # Increased to match generation loss scale
  lambda_regularization: 0.01

  # Output
  output_dir: checkpoints
