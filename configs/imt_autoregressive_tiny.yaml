# IMT Autoregressive Tiny: Debug generation with minimal context
#
# Very small context to isolate generation learning
# Now with explicit copy attention supervision

model:
  d_model: 128
  encoder_layers: 2
  encoder_heads: 4
  encoder_ff_dim: 512
  chunk_size: 64  # Very small chunks

  # Index configuration
  index_dim: 64
  num_index_heads: 4
  keys_per_chunk: 2
  temperature: 1.0

  # Decoder
  decoder_layers: 4
  decoder_heads: 4
  decoder_ff_dim: 512
  retrieval_top_k: 2  # Retrieve both chunks to ensure target is always retrieved

  # Vocabulary (full ASCII)
  vocab_size: 101
  dropout: 0.0
  max_hash_length: 10

  # Memory optimization
  use_gradient_checkpointing: false
  chunk_batch_size: 16
  memory_limit_fraction: 0.5

training:
  learning_rate: 0.001  # Higher LR
  weight_decay: 0.0
  warmup_steps: 100
  max_steps: 10000
  gradient_accumulation: 1
  eval_every: 200
  eval_samples: 50
  save_every: 2000
  log_every: 50

  # Very small context - ~2 chunks
  n_chars_problem: 100  # Just ~2 hash pairs
  num_queries: 1
  hops: 1
  hash_pair_str_length: 4  # 4-char hashes

  # Loss weights
  lambda_retrieval: 5.0  # Very strong retrieval
  lambda_regularization: 0.0
  lambda_contrastive: 2.0  # Strong embedding alignment
  lambda_copy: 0.5  # Stronger copy gate
  lambda_copy_attn: 2.0  # Strong copy attention supervision

  output_dir: checkpoints
  experiment_name: autoregressive_tiny
