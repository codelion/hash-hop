# IMT Learned Minimal: Absolute minimum to learn retrieval
# Start with 2 chunks - 50% random baseline, should be easy to beat
#
# The key challenge is learning the query-key alignment:
# - Query encoder produces query key from query embedding
# - Key extractor produces chunk keys from chunk encoding
# - These need to align for correct retrieval

model:
  # Smaller model for faster iteration
  d_model: 128
  encoder_layers: 2
  encoder_heads: 4
  encoder_ff_dim: 512
  chunk_size: 512

  # Index
  index_dim: 64  # Smaller for easier learning
  num_index_heads: 4
  keys_per_chunk: 4  # Fewer keys per chunk
  temperature: 1.0  # Higher temp for softer distribution initially

  # Decoder
  decoder_layers: 2
  decoder_heads: 4
  decoder_ff_dim: 512
  retrieval_top_k: 1  # Only retrieve 1 chunk - binary decision

  # Other
  vocab_size: 101
  dropout: 0.0  # No dropout for learning
  max_hash_length: 16
  use_gradient_checkpointing: false
  chunk_batch_size: 16
  memory_limit_fraction: 0.5

training:
  learning_rate: 0.001  # Higher LR for faster learning
  weight_decay: 0.0  # No weight decay initially
  warmup_steps: 50
  max_steps: 5000
  gradient_accumulation: 1
  eval_every: 100
  eval_samples: 20
  save_every: 500
  log_every: 10

  # MINIMAL: Just 2 chunks (1K chars)
  n_chars_problem: 1000
  num_queries: 1  # Single query per sample
  hops: 1
  hash_pair_str_length: 8

  # Very high retrieval weight to force learning
  lambda_retrieval: 5.0
  lambda_regularization: 0.0  # No regularization

  output_dir: checkpoints
  experiment_name: learned_minimal
