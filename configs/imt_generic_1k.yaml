# IMT Generic: 1K tokens - No task-specific heuristics
#
# Start with smaller context to learn the copy pattern, then scale up.

model:
  d_model: 256
  encoder_layers: 3
  encoder_heads: 8
  encoder_ff_dim: 1024
  chunk_size: 64

  # Index configuration
  index_dim: 128
  num_index_heads: 8
  keys_per_chunk: 2
  temperature: 1.0

  # Clustering
  num_clusters: 128

  # Decoder
  decoder_layers: 6
  decoder_heads: 8
  decoder_ff_dim: 1024
  retrieval_top_k: 8  # 50% of chunks at 1K

  # Vocabulary
  vocab_size: 101
  dropout: 0.1
  max_hash_length: 10

  # Memory optimization
  use_gradient_checkpointing: false
  chunk_batch_size: 16
  memory_limit_fraction: 0.6

training:
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_steps: 1000
  max_steps: 50000
  gradient_accumulation: 1
  eval_every: 2000
  eval_samples: 100
  save_every: 10000
  log_every: 200

  # 1K character context - easier to learn
  n_chars_problem: 1000
  num_queries: 1
  hops: 1
  hash_pair_str_length: 4

  # Loss weights
  lambda_retrieval: 10.0
  lambda_regularization: 0.01
  lambda_contrastive: 3.0
  lambda_copy: 1.0
  lambda_copy_attn: 5.0  # Stronger copy attention supervision

  output_dir: checkpoints
  experiment_name: generic_1k
