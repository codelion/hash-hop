# IMT Benchmark: 10K tokens (~10K characters)
#
# For comparison with Gemini 1.5 Flash benchmark (96% at 10K)
# Uses learnings from 1K experiments

model:
  d_model: 128
  encoder_layers: 2
  encoder_heads: 4
  encoder_ff_dim: 512
  chunk_size: 64  # Small chunks for better retrieval

  # Index configuration
  index_dim: 64
  num_index_heads: 4
  keys_per_chunk: 2
  temperature: 1.0

  # Clustering (for larger contexts)
  num_clusters: 512

  # Decoder
  decoder_layers: 4
  decoder_heads: 4
  decoder_ff_dim: 512
  retrieval_top_k: 16  # ~10% of chunks for 10K context

  # Vocabulary (full ASCII)
  vocab_size: 101
  dropout: 0.0
  max_hash_length: 10

  # Memory optimization
  use_gradient_checkpointing: false
  chunk_batch_size: 32
  memory_limit_fraction: 0.5

training:
  learning_rate: 0.001
  weight_decay: 0.0
  warmup_steps: 200
  max_steps: 15000
  gradient_accumulation: 1
  eval_every: 500
  eval_samples: 100
  save_every: 2000
  log_every: 100

  # 10K character context (~160 hash pairs)
  n_chars_problem: 10000
  num_queries: 1
  hops: 1  # 1-hop for now
  hash_pair_str_length: 4

  # Loss weights
  lambda_retrieval: 5.0
  lambda_regularization: 0.0
  lambda_contrastive: 2.0
  lambda_copy: 0.5
  lambda_copy_attn: 2.0

  output_dir: checkpoints
  experiment_name: benchmark_10k
