# IMT Generic: 10K tokens - No task-specific heuristics
#
# Fully generic model that must learn everything from data.
# Uses larger model and longer training to compensate for removed heuristics.

model:
  d_model: 256  # Larger model
  encoder_layers: 3  # More layers
  encoder_heads: 8
  encoder_ff_dim: 1024
  chunk_size: 64

  # Index configuration
  index_dim: 128  # Larger index
  num_index_heads: 8
  keys_per_chunk: 2
  temperature: 1.0

  # Clustering
  num_clusters: 512

  # Decoder - larger for better copy learning
  decoder_layers: 6  # More layers
  decoder_heads: 8
  decoder_ff_dim: 1024
  retrieval_top_k: 32

  # Vocabulary (full ASCII)
  vocab_size: 101
  dropout: 0.1  # Add some regularization
  max_hash_length: 10

  # Memory optimization
  use_gradient_checkpointing: false
  chunk_batch_size: 16  # Smaller batches for larger model
  memory_limit_fraction: 0.6

training:
  learning_rate: 0.0003  # Lower LR for larger model
  weight_decay: 0.01  # Add weight decay
  warmup_steps: 2000
  max_steps: 100000  # Train much longer
  gradient_accumulation: 2
  eval_every: 5000
  eval_samples: 100
  save_every: 10000
  log_every: 200

  # 10K character context
  n_chars_problem: 10000
  num_queries: 1
  hops: 1
  hash_pair_str_length: 4

  # Loss weights
  lambda_retrieval: 10.0
  lambda_regularization: 0.01
  lambda_contrastive: 3.0
  lambda_copy: 1.0  # Stronger copy loss
  lambda_copy_attn: 3.0  # Stronger copy attention loss

  output_dir: checkpoints
  experiment_name: generic_10k
