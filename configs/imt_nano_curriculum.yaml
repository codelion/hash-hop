# IMT-Nano Curriculum: Start with trivially small context
# 4 chunks = 100% recall by default, teaches the generation task first

model:
  # Encoder
  d_model: 256
  encoder_layers: 2
  encoder_heads: 4
  encoder_ff_dim: 1024
  chunk_size: 512

  # Index
  index_dim: 128
  num_index_heads: 4
  keys_per_chunk: 10
  num_clusters: 8
  temperature: 0.5

  # Decoder
  decoder_layers: 3
  decoder_heads: 4
  decoder_ff_dim: 1024
  retrieval_top_k: 4  # Same as num chunks = always retrieve all

  # Other
  dropout: 0.1
  max_hash_length: 20
  use_gradient_checkpointing: true
  chunk_batch_size: 16
  memory_limit_fraction: 0.33

training:
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_steps: 100
  max_steps: 2000
  gradient_accumulation: 1
  eval_every: 100
  eval_samples: 10
  save_every: 500
  log_every: 10

  # Data generation - ~2K chars = 4 chunks (trivially small)
  n_chars_problem: 2000
  num_queries: 3
  hops: 1
  hash_pair_str_length: 16

  # Loss weights - focus on generation first
  lambda_retrieval: 0.1
  lambda_regularization: 0.01

  # Output
  output_dir: checkpoints
