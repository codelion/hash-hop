# IMT-Nano Tiny: Very small context to verify retrieval learning
# Only ~20 chunks so retrieval loss gradients are meaningful

model:
  # Encoder
  d_model: 256
  encoder_layers: 2
  encoder_heads: 4
  encoder_ff_dim: 1024
  chunk_size: 512

  # Index
  index_dim: 128
  num_index_heads: 4
  keys_per_chunk: 10
  num_clusters: 32  # Reduced clusters for fewer chunks
  temperature: 0.5  # Lower temperature for sharper distributions

  # Decoder
  decoder_layers: 3
  decoder_heads: 4
  decoder_ff_dim: 1024
  retrieval_top_k: 4

  # Other
  dropout: 0.1
  max_hash_length: 20
  use_gradient_checkpointing: true
  chunk_batch_size: 16
  memory_limit_fraction: 0.33

training:
  learning_rate: 0.0005  # Lower LR for stability
  weight_decay: 0.01
  warmup_steps: 100
  max_steps: 5000
  gradient_accumulation: 1
  eval_every: 100
  eval_samples: 10
  save_every: 500
  log_every: 10

  # Data generation - 10K chars = ~20 chunks for easy retrieval
  n_chars_problem: 10000
  num_queries: 5
  hops: 1  # Start with 1-hop (direct lookup)
  hash_pair_str_length: 16

  # Loss weights
  lambda_retrieval: 0.5  # Balanced retrieval signal
  lambda_regularization: 0.1  # Increased for key diversity

  # Output
  output_dir: checkpoints
