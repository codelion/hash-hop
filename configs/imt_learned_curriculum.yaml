# IMT Learned Curriculum: Train purely learned retrieval and generation from scratch
# No token matching, no oracle copy - everything is learned end-to-end
#
# Key insights for learning from scratch:
# 1. Start with TINY context (4 chunks) so retrieval is easy
# 2. Use high retrieval loss weight to force correct chunk selection
# 3. Longer training for generation to learn cross-attention patterns
# 4. Higher learning rate initially, with warmup

model:
  # Encoder - moderate capacity
  d_model: 256
  encoder_layers: 2
  encoder_heads: 4
  encoder_ff_dim: 1024
  chunk_size: 512

  # Index - larger index dim for better discrimination
  index_dim: 128
  num_index_heads: 4
  keys_per_chunk: 8
  temperature: 0.5

  # Decoder - more layers for learning cross-attention patterns
  decoder_layers: 4
  decoder_heads: 4
  decoder_ff_dim: 1024
  retrieval_top_k: 2  # Only retrieve top 2 chunks to force precision

  # Other
  vocab_size: 101  # Full ASCII tokenizer
  dropout: 0.1
  max_hash_length: 20
  use_gradient_checkpointing: true
  chunk_batch_size: 16
  memory_limit_fraction: 0.5

training:
  # Learning rate - higher for faster learning
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_steps: 200
  max_steps: 10000
  gradient_accumulation: 1
  eval_every: 200
  eval_samples: 20
  save_every: 1000
  log_every: 20

  # CRITICAL: Start with VERY small context (4 chunks = ~2K chars)
  # This makes retrieval almost trivial (1/4 chance random)
  # The model can focus on learning generation patterns first
  n_chars_problem: 2000
  num_queries: 3
  hops: 1  # 1-hop only
  hash_pair_str_length: 8  # Shorter hashes for easier learning

  # Loss weights - high retrieval weight to force correct retrieval
  lambda_retrieval: 2.0
  lambda_regularization: 0.01

  # Output
  output_dir: checkpoints
  experiment_name: learned_curriculum_stage1
