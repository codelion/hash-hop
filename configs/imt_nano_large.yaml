# IMT-Nano Large: Test with larger context (100K chars = ~200 chunks)

model:
  # Encoder
  d_model: 256
  encoder_layers: 2
  encoder_heads: 4
  encoder_ff_dim: 1024
  chunk_size: 512

  # Index
  index_dim: 128
  num_index_heads: 4
  keys_per_chunk: 10
  num_clusters: 64
  temperature: 0.5

  # Decoder
  decoder_layers: 3
  decoder_heads: 4
  decoder_ff_dim: 1024
  retrieval_top_k: 4

  # Other
  dropout: 0.1
  max_hash_length: 20
  use_gradient_checkpointing: true
  chunk_batch_size: 16
  memory_limit_fraction: 0.33

training:
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_steps: 200
  max_steps: 5000
  gradient_accumulation: 1
  eval_every: 200
  eval_samples: 10
  save_every: 1000
  log_every: 20

  # Data generation - ~100K chars = ~200 chunks
  n_chars_problem: 100000
  num_queries: 3
  hops: 1
  hash_pair_str_length: 16

  # Loss weights
  lambda_retrieval: 1.0
  lambda_regularization: 0.01

  # Output
  output_dir: checkpoints
