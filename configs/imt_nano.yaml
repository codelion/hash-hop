# IMT-Nano: Proof of Concept for 10M context
# Target: ~12-15M parameters, ~8-12GB memory, 1-2 days training on M1/M2 Pro/Max

model:
  # Encoder
  d_model: 256
  encoder_layers: 2
  encoder_heads: 4
  encoder_ff_dim: 1024
  chunk_size: 512

  # Index
  index_dim: 128
  num_index_heads: 4
  keys_per_chunk: 10
  num_clusters: 256
  temperature: 1.0

  # Decoder
  decoder_layers: 3
  decoder_heads: 4
  decoder_ff_dim: 1024
  retrieval_top_k: 4

  # Other
  dropout: 0.1
  max_hash_length: 20
  use_gradient_checkpointing: true
  chunk_batch_size: 64
  memory_limit_fraction: 0.5  # Limit to 50% VRAM to allow other work

training:
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_steps: 1000
  max_steps: 100000
  gradient_accumulation: 4
  eval_every: 500
  eval_samples: 10
  save_every: 2000
  log_every: 10

  # Data generation - 10M tokens
  n_chars_problem: 10000000
  num_queries: 10
  hops: 2
  hash_pair_str_length: 16

  # Loss weights
  lambda_retrieval: 0.5
  lambda_regularization: 0.01

  # Output
  output_dir: checkpoints
