# IMT Learned Simple: Minimal architecture for debugging retrieval learning
#
# Key insight: Remove all complexity, make the model learn a simple mapping
# If retrieval can't be learned here, we have a fundamental issue

model:
  # Minimal model - almost no transformer layers
  d_model: 64
  encoder_layers: 1  # Single layer
  encoder_heads: 2
  encoder_ff_dim: 128
  chunk_size: 256  # Smaller chunks

  # Index - keep it simple
  index_dim: 64  # Same as d_model for simpler learning
  num_index_heads: 2
  keys_per_chunk: 2  # Only 2 keys per chunk
  temperature: 1.0

  # Minimal decoder
  decoder_layers: 1
  decoder_heads: 2
  decoder_ff_dim: 128
  retrieval_top_k: 1

  # Other
  vocab_size: 101
  dropout: 0.0
  max_hash_length: 12
  use_gradient_checkpointing: false
  chunk_batch_size: 16
  memory_limit_fraction: 0.5

training:
  learning_rate: 0.003  # Even higher LR
  weight_decay: 0.0
  warmup_steps: 0  # No warmup
  max_steps: 10000  # More steps
  gradient_accumulation: 1
  eval_every: 500
  eval_samples: 50
  save_every: 2000
  log_every: 50

  # 2 chunks only
  n_chars_problem: 500  # Very small
  num_queries: 1
  hops: 1
  hash_pair_str_length: 6  # Shorter hashes

  # Focus on retrieval
  lambda_retrieval: 10.0  # Very high
  lambda_regularization: 0.0

  output_dir: checkpoints
  experiment_name: learned_simple
