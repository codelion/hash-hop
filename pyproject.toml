[tool.poetry]
name = "hashhop"
version = "1.0.0"
description = "Long content evaluation for large language models"
authors = ["Magic Team <join@magic.dev>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
numpy = ">=1.22.2"
mlx = ">=0.18.0"
pyyaml = ">=6.0"
sentencepiece = "^0.2.1"
transformers = "^4.57.6"
torch = {version = "^2.0", optional = true}  # For ByT5 weight conversion
datasets = "^4.5.0"
mlx-lm = ">=0.20,<0.30"

[tool.poetry.extras]
torch = ["torch"]

[tool.poetry.group.dev.dependencies]
mypy = "^1.13.0"
pytest = "^8.3.4"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
pytest-timeout = "^2.3.1"
pytest-xdist = "^3.6.1"
ruff = "^0.8.0"
codespell = "^2.3.0"
pre-commit = "^4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = 3.9
disallow_untyped_defs = true
files = [
    "hashhop/**/*.py",
    "imt/**/*.py",
]
